name: Daily Content Generation

on:
  schedule:
    # 12:00 UTC = 6:00 PM Bangladesh (UTC+6).
    # Posting in the BD evening reaches US Crypto Twitter as it wakes up.
    - cron: "0 12 * * *"

  workflow_dispatch:
    inputs:
      pillar:
        description: "Override today's pillar (optional)"
        required: false
        type: choice
        options:
          - ""
          - founder_story
          - market_insight
          - technical_explainer
          - build_log
          - ecosystem_commentary
      force:
        description: "Re-run even if today already has a post"
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate today's content
        run: node index.js
        env:
          # Ollama is dropped here — GitHub runners have no local Ollama server.
          AI_PROVIDERS: groq,gemini
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash

          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ai-crypto-content-engine/1.0
          REDDIT_SUBREDDITS: CryptoCurrency,ethtrader,web3,gamedev,esports

          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          FARCASTER_CHANNELS: gaming,base,ethereum
          HN_QUERIES: "web3 gaming,crypto payments,esports,state channels"

          GITHUB_REPOS: ${{ vars.GITHUB_REPOS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          CONTENT_FOCUS: "Web3 gaming, esports monetization, streamer micropayments, GameReq founder perspective"
          PILLAR_OVERRIDE: ${{ inputs.pillar }}
          FORCE_RERUN: ${{ inputs.force }}

      # The Excel file lives on the ephemeral runner — upload it so you can
      # download the day's topic + drafts from the run's Artifacts.
      - name: Upload content workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-engine-xlsx
          path: data/content-engine.xlsx
          if-no-files-found: ignore
